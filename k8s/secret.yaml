apiVersion: v1
kind: Secret
metadata:
  name: cronsole-secret
  namespace: default
type: Opaque
# Every value below is a placeholder. Replace them before applying.
#
# stringData, not data: these are meant to be edited, and base64 in a template
# is how a key ends up wrong without anyone noticing. Kubernetes encodes them
# on the way in.
#
# The names have to match what internal/config reads. They did not before:
# DB_PASSWORD and SMTP_* were never looked up, so the application connected
# with an empty password and sent no mail, with nothing to say why.
stringData:
  # At least 32 characters, or boot is refused: a short secret makes every
  # session token forgeable.
  #   openssl rand -hex 32
  JWT_SECRET: "CHANGE_ME_at_least_32_characters_long"

  DB_PASS: "CHANGE_ME"

  MAIL_USER: "cron@example.com"
  MAIL_PASS: "CHANGE_ME"

  # There is no administrator credential here on purpose. The first account is
  # created through /setup, on a deployment that has none, and that screen
  # closes permanently once it exists. Reach it before anyone else can.
